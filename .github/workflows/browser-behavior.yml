name: Browser behavior
on:
  pull_request:
  workflow_dispatch:
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        group: [alpine, soccer, other, offline]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --package-lock=false playwright@1.62.1
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser -- ${{ matrix.group }}
        env:
          ISLAND_CSP_AUDIT_DIR: artifacts/browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-${{ matrix.group }}
          path: artifacts/browser
          if-no-files-found: warn
