name: Publish app
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Only the app files are published (never docs, tests, SQL or notes)
        run: |
          mkdir -p _site
          cp index.html manifest.json sw.js _site/
          cp -r css js icons _site/
          [ -d workout ] && cp -r workout _site/workout || true
          [ -d north ] && cp -r north _site/north || true
          rm -rf _site/workout/docs _site/workout/tests 2>/dev/null || true
          find _site/workout/island/design -type d -name source -prune -exec rm -rf {} + 2>/dev/null || true
          # Review packs of assets not wired into a game yet (hundreds of MB): not published. When a pack is wired, its runtime copy lives under workout/island/assets/.
          for d in hoops-v7 racing-v7 racing-formula racing-audio-v2 defense-v7 alpine-v7 naval-v7 tennis-v7 fire-v7 soccer-v6 soccer-v7 hoops-v6 broadcast-v1 hoops-motion-v8 soccer-motion-v8 soccer-stadium-v8 hoops-arena-v8 audio-v8 ui-kit-v8 ship-chase-models-v1 sirens-vulcan-audio-v1 alien-v16 aliens-controls-v1 alpine-start-lights-v1 athlete-body-v1 athlete-kits-v1 boars-aim-v1 catch-siren-v3 crowd-audio-v1 fire-building-v1 fire-fx-v1 fire-rescue-v1 fire-rooms-v1 fire-tools firefighter-v1 hockey-v1 hockey-v1-fix hockey-v2 hoops-crowd-3d-v1 hoops-motion-v10 hoops-motion-v11 hoops-motion-v13 hoops-motion-v9 hoops-ref-scoreboard-v1 hoops-referee-audio-v1 hoops-tall-v1 motion-fix-v12 naval-air-audio-v1 naval-base-fx-v1 naval-base-models-v1 racing-audio-v4 racing-formula-cars-v1 racing-fx-v2 racing-liveries-v1 racing-pit-v1 soccer-kicks-v2 soccer-locomotion-v2 soccer-motion-v10 soccer-motion-v11 soccer-motion-v9 soccer-referee-v1 soccer-tackle-keeper-v2 soccer-whistle-crowd-v1 tennis-crowd-audio-v1 tennis-grip-v1 tennis-motion-v1 tennis-stadium-v1 tennis-ui-fx-v1 alien-fx-v1 alpine-themes-v1 athlete-body-v2 athlete-lod-v1 catch-audio-v2 refill-enemyfire-v1 soccer-clips-v13 soccer-crowd-3d-v1 soccer-fx-v1 soccer-pitch-v1 torpedo-sub-v1; do rm -rf "_site/workout/island/design/$d"; done
          find _site -name '*.md' -o -name '*.csv' -o -name '*.xlsx' -o -name '*.sql' -o -name '*.bundle' | xargs -r rm -f
          ls _site
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
        with:
          # 10/11/2026: the v20 deploy hung in syncing_files past the default 10 minutes and was aborted; the live site stayed on v19.
          timeout: 1800000
