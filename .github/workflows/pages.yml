name: Publish app
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Only the app files are published (never docs, tests, SQL or notes)
        run: |
          mkdir -p _site
          cp index.html manifest.json sw.js _site/
          cp -r css js icons _site/
          [ -d workout ] && cp -r workout _site/workout || true
          [ -d north ] && cp -r north _site/north || true
          rm -rf _site/workout/docs _site/workout/tests 2>/dev/null || true
          find _site/workout/island/design -type d -name source -prune -exec rm -rf {} + 2>/dev/null || true
          # Review packs of assets not wired into a game yet (hundreds of MB): not published. When a pack is wired, its runtime copy lives under workout/island/assets/.
          for d in hoops-v7 racing-v7 racing-formula racing-audio-v2 defense-v7 alpine-v7 naval-v7 tennis-v7 fire-v7 soccer-v6 soccer-v7 hoops-v6 broadcast-v1 hoops-motion-v8 soccer-motion-v8 soccer-stadium-v8 hoops-arena-v8 audio-v8 ui-kit-v8; do rm -rf "_site/workout/island/design/$d"; done
          find _site -name '*.md' -o -name '*.csv' -o -name '*.xlsx' -o -name '*.sql' -o -name '*.bundle' | xargs -r rm -f
          ls _site
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
