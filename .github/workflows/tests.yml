name: Tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test tests/*.mjs
  alpine-csp:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install the pinned browser test runtime
        run: npm install --no-save --package-lock=false playwright@1.62.1
      - run: npx playwright install --with-deps chromium
      - name: Enforce the shipped CSP, negative fixtures and real Alpine startup
        env:
          ISLAND_CSP_BROWSER: '1'
          ISLAND_CSP_AUDIT_DIR: artifacts/alpine-csp
        run: node --test tests/island-browser-csp.test.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: alpine-csp
          path: artifacts/alpine-csp
          if-no-files-found: ignore
