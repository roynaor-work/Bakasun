<!doctype html>
<html lang="he" dir="rtl">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ניסוי: דו-ממד מול תלת-ממד</title>
<style>
:root{--bg:#f6f1fb;--ink:#1f1a2e;--muted:#6b6480;--card:#fff;--line:#e4dcef;--accent:#d63fa6}
@media (prefers-color-scheme:dark){:root{--bg:#171322;--ink:#f3eefa;--muted:#a79fbb;--card:#221c33;--line:#352c4c}}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Heebo,Assistant,Arial,sans-serif;direction:rtl;text-align:right;unicode-bidi:embed}
.wrap{max-width:900px;margin:0 auto;padding:16px;display:grid;gap:12px}
h1{margin:0;font-size:22px}p{margin:0;color:var(--muted);font-size:14px;line-height:1.5}
.chips{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip,select{font:inherit;font-size:15px;font-weight:700;padding:9px 14px;border-radius:999px;border:2px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;min-height:40px}
.chip.on{border-color:var(--accent);color:var(--accent)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:560px){.row{grid-template-columns:1fr}}
.cell{display:grid;gap:6px}.cell b{font-size:15px}
.view{position:relative;width:100%;aspect-ratio:4/5;border-radius:18px;overflow:hidden;background:#F2A9E3}
.view canvas{width:100%!important;height:100%!important;display:block}
</style>
<div class="wrap">
  <div><h1>ניסוי: אותו תרגיל בדו-ממד ובתלת-ממד</h1><p>משמאל: הדמות כמו היום (מצלמה עם עומק, שתי דרגות צבע). מימין: מצלמה ישרה בלי עומק, צבע שטוח לגמרי וקו מתאר עבה, כמו אנימציה דו-ממדית. אותה דמות, אותן פוזות.</p></div>
  <div class="chips"><select id="sel"></select><button class="chip" id="slow">🐢 איטי (הסבר)</button></div>
  <div class="row">
    <div class="cell"><b>2. דו-ממד (ניסוי)</b><div class="view" id="flat"></div></div>
    <div class="cell"><b>1. היום (תלת-ממד מצויר)</b><div class="view" id="v3d"></div></div>
  </div>
</div>
<script type="module">
import { Stage3D } from '../js/stage3d.js?v=20261010-camera-1';
import { EXERCISES, byId } from '../js/exercises.js?v=20261010-camera-1';
const sel = document.getElementById('sel'); EXERCISES.forEach(e => { const o = document.createElement('option'); o.value = e.id; o.textContent = e.name; sel.appendChild(o); });
const q = new URLSearchParams(location.search); let cur = byId[q.get('ex')] ? q.get('ex') : 'jumping-jacks'; sel.value = cur; let speed = 1, ready = 0;
const a = new Stage3D(document.getElementById('v3d'), byId[cur], { onReady: () => { ready++; window.__flat = { ready }; } });
const b = new Stage3D(document.getElementById('flat'), byId[cur], { flat: true, onReady: () => { ready++; window.__flat = { ready }; } });
sel.onchange = () => { cur = sel.value; a.play(byId[cur], speed); b.play(byId[cur], speed); history.replaceState(null, '', `?ex=${cur}`); };
document.getElementById('slow').onclick = e => { speed = speed === 1 ? .75 : 1; a.play(byId[cur], speed); b.play(byId[cur], speed); e.target.classList.toggle('on', speed !== 1); };
</script>
</html>
