<!doctype html>
<html lang="he" dir="rtl">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>הדמות המצוירת</title>
<style>
:root{--bg:#f6f1fb;--ink:#1f1a2e;--muted:#6b6480;--card:#fff;--line:#e4dcef;--accent:#d63fa6}
@media (prefers-color-scheme:dark){:root{--bg:#171322;--ink:#f3eefa;--muted:#a79fbb;--card:#221c33;--line:#352c4c}}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Heebo,Assistant,Arial,sans-serif;direction:rtl;text-align:right;unicode-bidi:embed}
.wrap{max-width:560px;margin:0 auto;padding:16px;display:grid;gap:12px}
h1{margin:0;font-size:22px}p{margin:0;color:var(--muted);font-size:14px;line-height:1.5}
.chips{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip,select{font:inherit;font-size:15px;font-weight:700;padding:9px 14px;border-radius:999px;border:2px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;min-height:40px}
.chip.on{border-color:var(--accent);color:var(--accent)}
.view{position:relative;width:100%;aspect-ratio:4/5;border-radius:18px;overflow:hidden;background:#F2A9E3}
.view canvas{width:100%!important;height:100%!important;display:block}
.tag{position:absolute;top:8px;right:8px;background:rgba(0,0,0,.55);color:#fff;padding:4px 10px;border-radius:999px;font-size:13px}
</style>
<div class="wrap">
  <div><h1>הדמות המצוירת: כמו באפליקציה</h1><p>זה בדיוק הרכיב שנכנס למסך התרגיל (סגנון 3): קו מתאר עבה, צבעים שטוחים, רצפה וצל מתחת לרגליים, חדות לפי מסך הטלפון, פרצוף מצויר.</p></div>
  <div class="chips"><select id="sel"></select><button class="chip" id="slow">🐢 איטי (הסבר)</button><button class="chip" id="rot">🔄 מצלמה</button></div>
  <div class="view" id="view"><span class="tag" id="tag">טוען...</span></div>
</div>
<script type="module">
import { Stage3D } from '../js/stage3d.js';
import { EXERCISES, byId } from '../js/exercises.js';
const CATS = { warm: 'חימום', jump: 'ניתור', speed: 'מהירות', core: 'בטן', legs: 'רגליים', upper: 'כוח עליון', stretch: 'מתיחות' };
const sel = document.getElementById('sel');
for (const cat in CATS) { const og = document.createElement('optgroup'); og.label = CATS[cat]; EXERCISES.filter(e => e.cat === cat).forEach(e => { const o = document.createElement('option'); o.value = e.id; o.textContent = e.name; og.appendChild(o); }); sel.appendChild(og); }
const q = new URLSearchParams(location.search); let cur = byId[q.get('ex')] ? q.get('ex') : 'jumping-jacks'; sel.value = cur;
const view = document.getElementById('view'), tag = document.getElementById('tag');
let speed = 1;
const st = new Stage3D(view, byId[cur], { onReady: () => { tag.textContent = byId[cur].name; window.__cartoon = { ready: true, st }; }, onFail: () => { tag.textContent = 'אין WebGL במכשיר הזה'; } });
view.appendChild(tag);
sel.onchange = () => { cur = sel.value; st.play(byId[cur], speed); tag.textContent = byId[cur].name; history.replaceState(null, '', `?ex=${cur}`); };
document.getElementById('slow').onclick = e => { speed = speed === 1 ? .55 : 1; st.play(byId[cur], speed); e.target.classList.toggle('on', speed !== 1); };
document.getElementById('rot').onclick = () => { st.camAngle += Math.PI / 6; st.placeCam(); };
</script>
</html>
