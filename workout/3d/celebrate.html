<!doctype html><html dir="rtl" lang="he"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>חגיגות שיא בתלת-ממד</title>
<link rel="stylesheet" href="../css/style.css">
<style>body{margin:0;background:#1E1B3A;color:#fff;font-family:Rubik,Arial,sans-serif;direction:rtl;text-align:right;unicode-bidi:embed;padding:12px}#bar{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:12px}#bar button{font:inherit;font-size:15px;padding:8px 12px;border-radius:999px;border:0;background:#6C4CF1;color:#fff}#bar button.on{background:#FDE047;color:#1E1B3A}.gcanvas{margin:0 auto}#err{text-align:center;color:#FCA5A5;font-size:14px;min-height:20px;margin-top:8px}</style></head><body>
<!-- דף צפייה בחגיגות השיא (בלי לשבור שיא): לוחצים על סצנה. ?scene=goal|header|dunk|three|sprint, ?step=1 = צעד זמן קבוע לצילום פריימים בבדיקות -->
<div id="bar"></div>
<div class="gcanvas"><canvas width="360" height="560"></canvas></div>
<div id="err"></div>
<script type="module">
import { celebrate3d, SCENE_IDS_3D } from '../js/games/celebrate3d.js?v=20261009-weekly-1';
const NAMES = { goal: '⚽ שער מבעיטה', header: '⚽ שער בנגיחה', dunk: '🏀 סלאם דאנק', three: '🏀 קליעת שלוש', sprint: '🏃 ריצת 100 מטר' };
const u = new URL(location.href); if (u.searchParams.get('step')) window.__c3dStep = 1 / 24;
const cv = document.querySelector('canvas'), bar = document.getElementById('bar'), err = document.getElementById('err');
let stop = null;
function show(id) {
  if (stop) stop(); window.__c3dError = ''; err.textContent = '';
  const g = cv.getContext('2d'); g.fillStyle = '#1E1B3A'; g.fillRect(0, 0, 360, 560);
  bar.querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.scene === id));
  stop = celebrate3d(cv, { oldBest: 100, newBest: 150, sound: !u.searchParams.get('step'), scene: id, onText() {}, onDone() { window.__done = true; if (window.__c3dError) err.textContent = 'התלת־ממד נכשל במכשיר הזה, הוצגה החגיגה הדו־ממדית: ' + window.__c3dError; } });
}
bar.innerHTML = SCENE_IDS_3D.map(id => `<button data-scene="${id}">${NAMES[id]}</button>`).join('');
bar.querySelectorAll('button').forEach(b => b.onclick = () => show(b.dataset.scene));
show(SCENE_IDS_3D.includes(u.searchParams.get('scene')) ? u.searchParams.get('scene') : 'goal');
</script></body></html>
