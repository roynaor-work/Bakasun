<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>מדידת ביצועים: כדורסל</title>
<style>
 html,body{margin:0;height:100%;background:#05060a;color:#eee;font-family:system-ui,sans-serif;direction:rtl;text-align:right;unicode-bidi:embed}
 .game-screen{position:fixed;inset:0}
 .game-header{position:absolute;inset:0 0 auto 0;z-index:6;display:flex;justify-content:flex-end;padding:8px}
 .game-stage{position:absolute;inset:0}
 .minigame-canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
 .game-controls{position:absolute;inset:0}
 #perf{position:fixed;z-index:50;left:8px;bottom:8px;max-width:min(92vw,420px);background:#0c111ce6;border:1px solid #ffffff2e;border-radius:10px;padding:8px 10px;font-size:13px;line-height:1.5;direction:rtl}
 #perf table{border-collapse:collapse;width:100%}
 #perf td{padding:1px 6px;border-bottom:1px solid #ffffff14}
 #perf td:last-child{direction:ltr;text-align:left;font-variant-numeric:tabular-nums}
 #perf button{margin-top:6px;min-height:40px;padding:0 14px;border-radius:8px;border:1px solid #ffffff55;background:#1b2130;color:#fff;font-size:14px}
 #perf .live{color:#ffb020}
 #perf[hidden]{display:none}
</style>
</head>
<body>
<div class="game-screen" data-game="streetSlam">
 <header class="game-header"><button type="button" data-action="game-pause" aria-label="pause" hidden></button></header>
 <p class="game-status" role="status" aria-live="polite"></p>
 <div class="game-stage"><canvas class="minigame-canvas" tabindex="0" aria-label="basketball"></canvas></div>
 <div class="game-controls"></div>
</div>
<div id="perf"><div class="live">טוען</div></div>
<script type="module" src="./perf-hoops-page.mjs"></script>
</body>
</html>
