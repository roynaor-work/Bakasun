<!doctype html>
<meta charset="utf-8"><title>catch audio probe</title>
<!-- Measures the sound set of "תפוס את הפושע" in a real browser: does the recorded siren decode and play (status().sirenLive,
     not the synth fallback), and how loud is each cue. Loudness = the loudest 46 ms RMS window during the cue ("peak") and the
     mean RMS over the measured span ("mean"), tapped from audio.output() with an AnalyserNode, so the numbers are before the limiter.
     Run: tools/catch-audio-probe.html?auto=1 with autoplay allowed (Playwright: autoplay-policy=no-user-gesture-required), then read
     window.report after window.done. Without ?auto=1 the page waits for a tap (the phone path: suspended context, first gesture). -->
<style>body{font:14px system-ui;margin:16px;background:#111;color:#eee}button{font:inherit;padding:8px 14px;margin:4px}pre{white-space:pre-wrap}</style>
<body>
<div id="bar"><button id="run">הרץ מדידה</button> <span id="st"></span></div>
<pre id="out"></pre>
<script type="module">
import {createCatchAudio} from '../minigames/catch-audio.mjs?v=island-v2-20261107-12';
const out = document.getElementById('out'), st = document.getElementById('st'), log = s => { out.textContent += s + '\n'; };
// ?siren=v7: the v7 level without the sound pack (SIREN7 .55 of the v6 gain, ?catchAssets=0); ?pack=v7: the v7 sound pack (Codex,
// PACK7 in catch-audio.mjs), as catch-session6.mjs plays it by default
const query = new URLSearchParams(location.search), pack = query.get('pack') === 'v7';
const audio = createCatchAudio(pack ? {sirenScale: .55, pack: 'v7'} : query.get('siren') === 'v7' ? {sirenScale: .55} : {}); window.audio = audio;
const report = {cues: {}, siren: {}, status: {}};
let analyser = null, buf = null;
const tap = () => {
  if (analyser) return true; const node = audio.output(); if (!node) return false;
  analyser = node.context.createAnalyser(); analyser.fftSize = 2048; node.connect(analyser); analyser.connect(node.context.destination); buf = new Float32Array(analyser.fftSize); return true;
};
const rms = () => { analyser.getFloatTimeDomainData(buf); let s = 0; for (const v of buf) s += v * v; return Math.sqrt(s / buf.length); };
const sleep = ms => new Promise(r => setTimeout(r, ms));
// Short cues are measured twice and the louder pass is kept: headless Chromium stalls the render thread now and then and a
// 46 ms window can miss a 100 ms beep (seen: 'count' .002 in one run, .023 in the next).
async function measure(name, fn, ms = 700, reps = ms < 1000 ? 2 : 1) {
  let peak = 0, sum = 0, n = 0;
  for (let r = 0; r < reps; r++) {
    let p = 0, s = 0, k = 0; const t0 = performance.now(); fn();
    while (performance.now() - t0 < ms) { const v = rms(); p = Math.max(p, v); s += v; k++; await sleep(8); }
    if (p > peak) { peak = p; sum = s; n = k; }
    await sleep(250);
  }
  report.cues[name] = {peak: +peak.toFixed(4), mean: +(sum / Math.max(1, n)).toFixed(4)}; log(name.padEnd(18) + ' peak ' + peak.toFixed(4) + '  mean ' + (sum / Math.max(1, n)).toFixed(4));
}
async function run() {
  if (!tap()) { log('no AudioContext'); window.report = report; window.done = true; return; }
  report.status.afterGesture = audio.status(); st.textContent = 'state ' + report.status.afterGesture.state;
  audio.cue('engine'); // v5 start cue: also kicks the loop decode
  for (let i = 0; i < 40 && !audio.status().sirenDecoded.twoTone; i++) await sleep(50);
  for (let i = 0; i < 60 && pack && audio.status().pack?.decoded < audio.status().pack?.of; i++) await sleep(50);
  report.status.decoded = audio.status();
  await measure('siren-first-call', () => audio.cue('siren', {approach: 0}), 900, 1);
  report.status.sirenFirst = audio.status();
  for (let i = 0; i < 3; i++) await measure('siren-loop-' + i, () => audio.cue('siren', {approach: .5}), 800, 1);
  report.status.sirenLoop = audio.status();
  // v7 pack: the near siren of a police roadblock (the v6 and v7s runs play their one loop here, at the same full level)
  await measure('siren-near', () => audio.cue('siren', {approach: .5, near: true}), 800, 1); report.status.sirenNear = audio.status();
  await measure('siren-far', () => audio.cue('siren', {approach: -1, level: .5}), 800, 1);
  await sleep(1300); report.status.sirenAfterHold = audio.status();
  await measure('siren-crew', () => audio.cue('siren', {crew: true}), 900, 1); await sleep(1600);
  await measure('engine-idle-4', () => { const iv = setInterval(() => audio.engine(4, false), 50); setTimeout(() => clearInterval(iv), 900); }, 1000);
  await measure('engine-20', () => { const iv = setInterval(() => audio.engine(20, false), 50); setTimeout(() => clearInterval(iv), 900); }, 1000);
  await measure('engine-31-boost', () => { const iv = setInterval(() => audio.engine(31, true), 50); setTimeout(() => { clearInterval(iv); }, 900); }, 1000);
  report.status.engine = audio.status();
  await measure('engine+siren', () => { audio.cue('siren', {approach: .3}); const iv = setInterval(() => audio.engine(28, true), 50); setTimeout(() => { clearInterval(iv); audio.engineStop(); }, 900); }, 1000);
  await sleep(1300);
  for (const c of ['shot', 'shotHit', 'turn', 'flat', 'skid', 'twang', 'whistle', 'whoosh', 'hitBody', 'hitHead', 'catch', 'perfect', 'crash', 'scrape', 'ram', 'thud', 'count', 'go', 'tool', 'miss', 'near', 'brake', 'nitro', 'nitroPickup', 'barrier', 'sticky', 'spikes']) await measure(c, () => audio.cue(c), c === 'skid' || c === 'flat' ? 1500 : 800);
  await measure('draw', () => { let k = 0; const iv = setInterval(() => { k += .1; audio.cue('draw', Math.min(1, k)); if (k > 1.2) clearInterval(iv); }, 60); }, 900, 1);
  await measure('stack-shot+siren+engine', () => { audio.cue('siren', {approach: .5}); const iv = setInterval(() => audio.engine(30, true), 50); audio.cue('shotHit'); setTimeout(() => audio.cue('shot'), 150); setTimeout(() => audio.cue('flat'), 300); setTimeout(() => { clearInterval(iv); audio.engineStop(); }, 900); }, 1000);
  report.status.final = audio.status();
  window.report = report; window.done = true; log(JSON.stringify(report, null, 1));
}
document.getElementById('run').addEventListener('click', run);
if (new URLSearchParams(location.search).get('auto') === '1') run();
else { st.textContent = 'state ' + audio.status().state + ' (לחצו להרצה)'; }
</script>
