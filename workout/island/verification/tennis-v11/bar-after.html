<!doctype html><html dir="rtl" lang="he"><meta charset="utf-8"><body style="margin:0;background:#2f6b5e;color:#fff;font:14px sans-serif">
<link rel="stylesheet" href="../../minigames/g4f-tennis.css"><link rel="stylesheet" href="../../minigames/tennis.css">
<style>.row{display:flex;gap:50px;justify-content:center;align-items:flex-end;height:390px;padding-bottom:30px;box-sizing:border-box}.cell{text-align:center;width:130px}.stage{position:relative;height:130px;width:90px;margin:0 auto 12px}.stage .tennis-serve-meter,.stage .tennis-power-meter{position:absolute!important;top:10px!important;bottom:auto!important;right:auto!important;left:auto!important}.stage .tennis-serve-meter{left:50px!important}.stage .tennis-power-meter{left:16px!important}.top{position:absolute;top:8px;left:50%;transform:translateX(-50%);background:#173f36;border-top:3px solid #c8a45a;padding:6px 14px;font-size:13px;text-align:center}</style>
<div class="top" style="display:none">שלב 7 / 30 · חבטה טובה<br><small>זוזו עם הג׳ויסטיק · שחררו לחבטה</small></div>
<div class="game-screen" data-game="tennis"><div class="row game-stage" id="r"></div></div>
<script>
const g=.12*100,y=.32*100;
function cell(label,{power,hit,value,grade='good',charge=.3}){const c=document.createElement('div');c.className='cell';const st=document.createElement('div');st.className='stage';
 if(hit){const m=document.createElement('div');m.className='tennis-serve-meter';m.dataset.mode='hit';m.dataset.grade=grade;m.style.background=`linear-gradient(to top,#f06960 0% ${50-y}%,#efc355 ${50-y}% ${50-g}%,#67d398 ${50-g}% ${50+g}%,#efc355 ${50+g}% ${50+y}%,#f06960 ${50+y}%)`;const n=document.createElement('span');n.className='tennis-serve-needle';n.style.position='absolute';n.style.bottom=value*100+'%';m.append(n);st.append(m);}
 if(power){const p=document.createElement('div');p.className='tennis-power-meter';p.dataset.v9='true';p.style.setProperty('--lo','0%');p.style.setProperty('--safe','12%');p.style.setProperty('--out','73%');const f=document.createElement('span');f.className='tennis-power-fill';f.style.height=charge*100+'%';p.append(f);st.append(p);}
 c.append(st,label);document.getElementById('r').append(c);}
cell('לפני: שני מדים',{power:true,hit:true,value:.5});
cell('אחרי: פס אחד, חלש מדי',{hit:true,value:.28});cell('אחרי: ירוק',{hit:true,value:.5});cell('אחרי: חזק מדי',{hit:true,value:.85,grade:'weak'});
document.querySelector('.top').dataset.x=1;
</script></html>
