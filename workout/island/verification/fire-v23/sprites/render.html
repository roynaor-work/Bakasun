<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>fire v23 sprite renderer</title></head>
<body style="margin:0;background:transparent">
<!-- 13/11/2026 fire v23: renders the game's 2D sprites and backgrounds from the island's 3D assets (Codex fire-rooms, fire-building,
     fire-rescue and fire-tools packs, fire-v7, Meshy) and simple box geometry. Driven by make-sprites.mjs; only the produced
     PNG/WebP files ship. Features: GLB camera nodes, intact/burnt and open/fallen states, diff overlays, animation frame sheets. -->
<script type="module">
import * as T from '/workout/island/vendor/three.module.js';
import {GLTFLoader} from '/workout/island/vendor/GLTFLoader.js';
import {DRACOLoader} from '/workout/island/vendor/DRACOLoader.js';
const loader=new GLTFLoader(),draco=new DRACOLoader();draco.setDecoderPath('/workout/island/vendor/draco/');loader.setDRACOLoader(draco);
const cache=new Map();
async function gltf(url){if(!cache.has(url))cache.set(url,loader.loadAsync(url));return cache.get(url);}
function cloneSkinned(source){const root=source.clone(true),copies=new Map();const map=(a,b)=>{copies.set(a,b);for(let i=0;i<a.children.length;i++)map(a.children[i],b.children[i]);};map(source,root);
  source.traverse(o=>{if(!o.isSkinnedMesh)return;const m=copies.get(o);m.skeleton=o.skeleton.clone();m.skeleton.bones=o.skeleton.bones.map(b=>copies.get(b));m.bind(m.skeleton,o.bindMatrix);});return root;}
function texture(draw,size=256,repeat){const c=document.createElement('canvas');c.width=c.height=size;draw(c.getContext('2d'),size);const t=new T.CanvasTexture(c);t.colorSpace=T.SRGBColorSpace;t.wrapS=t.wrapT=T.RepeatWrapping;if(repeat)t.repeat.set(...repeat);return t;}
function material(spec){
  const m=new T.MeshStandardMaterial({color:spec.color||'#cccccc',roughness:spec.roughness??0.8,metalness:spec.metalness??0});
  if(spec.emissive){m.emissive=new T.Color(spec.emissive);m.emissiveIntensity=spec.emissiveIntensity??1;}
  if(spec.opacity!==undefined){m.transparent=true;m.opacity=spec.opacity;}
  if(spec.stripes){m.map=texture((g,n)=>{g.fillStyle=spec.color;g.fillRect(0,0,n,n);g.fillStyle=spec.stripes.color;const k=spec.stripes.count||8;for(let i=0;i<k;i++){if(spec.stripes.dir==='v')g.fillRect(i*n/k,0,n/k*(spec.stripes.width||0.5),n);else g.fillRect(0,i*n/k,n,n/k*(spec.stripes.width||0.5));}},256,spec.stripes.repeat);m.color=new T.Color('#ffffff');}
  if(spec.checker){m.map=texture((g,n)=>{const k=spec.checker.count||8,s=n/k;for(let y=0;y<k;y++)for(let x=0;x<k;x++){g.fillStyle=(x+y)%2?spec.checker.a:spec.checker.b;g.fillRect(x*s,y*s,s,s);}},256,spec.checker.repeat);m.color=new T.Color('#ffffff');}
  if(spec.planks){m.map=texture((g,n)=>{const k=spec.planks.count||8;for(let i=0;i<k;i++){g.fillStyle=spec.planks.colors[i%spec.planks.colors.length];g.fillRect(0,i*n/k,n,n/k);g.fillStyle='rgba(0,0,0,.18)';g.fillRect(0,(i+1)*n/k-2,n,2);g.fillRect((i*173)%n,i*n/k,2,n/k);}},512,spec.planks.repeat);m.color=new T.Color('#ffffff');}
  return m;
}
function primitive(p){
  let g;
  if(p.box)g=new T.BoxGeometry(...p.box);else if(p.cyl)g=new T.CylinderGeometry(p.cyl[0],p.cyl[1],p.cyl[2],p.cyl[3]||24);else if(p.sphere)g=new T.SphereGeometry(p.sphere[0],p.sphere[1]||24,p.sphere[2]||16);
  else if(p.plane)g=new T.PlaneGeometry(...p.plane);else if(p.cone)g=new T.ConeGeometry(p.cone[0],p.cone[1],p.cone[2]||24);
  const mesh=new T.Mesh(g,material(p));mesh.position.fromArray(p.pos||[0,0,0]);if(p.rot)mesh.rotation.set(...p.rot);if(p.scale)mesh.scale.fromArray(p.scale);
  mesh.castShadow=p.castShadow??true;mesh.receiveShadow=p.receiveShadow??true;return mesh;
}
function skyTexture(top,bottom,horizon){const c=document.createElement('canvas');c.width=4;c.height=512;const g=c.getContext('2d');const gr=g.createLinearGradient(0,0,0,512);gr.addColorStop(0,top);gr.addColorStop(0.72,bottom);gr.addColorStop(1,horizon||bottom);g.fillStyle=gr;g.fillRect(0,0,4,512);const t=new T.CanvasTexture(c);t.colorSpace=T.SRGBColorSpace;return t;}
const within=(node,root)=>{for(let n=node;n;n=n.parent)if(n===root)return true;return false;};
/** State operations on a placed model: hide/show nodes, intact/burnt swaps (scale-0 states keep extras.restScale), door/target poses. */
function applyOps(root,ops=[]){
  for(const op of ops){
    if(op.op==='hide'){const re=new RegExp(op.match);root.traverse(n=>{if(re.test(n.name))n.visible=false;});}
    else if(op.op==='only'){const keep=op.nodes.map(name=>root.getObjectByName(name)).filter(Boolean);root.traverse(n=>{if(n.isMesh)n.visible=keep.some(k=>within(n,k));});}
    else if(op.op==='show'){const n=root.getObjectByName(op.node);if(n){n.visible=true;const s=n.userData?.restScale||[1,1,1];if(n.scale.x===0||n.scale.y===0)n.scale.fromArray(s);}}
    else if(op.op==='swap'){ // intact -> burnt for a burn_<name> group (rooms) or win_<n> (buildings)
      const intact=root.getObjectByName(op.intact),burnt=root.getObjectByName(op.burnt);if(intact)intact.visible=false;if(burnt){burnt.visible=true;burnt.scale.fromArray(burnt.userData?.restScale||[1,1,1]);}}
    else if(op.op==='unswap'){const intact=root.getObjectByName(op.intact),burnt=root.getObjectByName(op.burnt);if(intact)intact.visible=true;if(burnt){burnt.scale.set(0,0,0);burnt.visible=false;}}
    else if(op.op==='pose'){const n=root.getObjectByName(op.node);if(n){if(op.translation)n.position.fromArray(op.translation);if(op.rotation)n.quaternion.fromArray(op.rotation);}}
    else if(op.op==='state'){const n=root.getObjectByName(op.node),st=n?.userData?.states?.[op.state];if(st){if(st.translation)n.position.fromArray(st.translation);if(st.rotation)n.quaternion.fromArray(st.rotation);}}
  }
  root.updateMatrixWorld(true);
}
async function buildScene(spec){
  const scene=new T.Scene();
  if(spec.sky)scene.background=skyTexture(...spec.sky);else if(spec.bg)scene.background=new T.Color(spec.bg);
  if(spec.fog)scene.fog=new T.Fog(...spec.fog);
  const L=spec.lights||{};
  scene.add(new T.HemisphereLight(L.sky||'#eef3f7',L.ground||'#5d564d',L.hemi??1.35));
  const sun=new T.DirectionalLight(L.sunColor||'#fff0d8',L.sun??2.4);sun.position.fromArray(L.sunPos||[-6,12,9]);sun.castShadow=L.shadows!==false;sun.shadow.mapSize.set(2048,2048);
  const sc=L.shadowBox||14;Object.assign(sun.shadow.camera,{left:-sc,right:sc,top:sc,bottom:-sc,near:.5,far:80});sun.shadow.bias=-0.0004;sun.shadow.normalBias=0.04;sun.target.position.fromArray(L.sunTarget||[0,0,0]);scene.add(sun,sun.target);
  if(L.fill!==0){const fill=new T.DirectionalLight(L.fillColor||'#cfe0ff',L.fill??0.55);fill.position.fromArray(L.fillPos||[8,5,-6]);scene.add(fill);}
  for(const p of L.points||[]){const pl=new T.PointLight(p.color,p.intensity,p.distance||0,p.decay??2);pl.position.fromArray(p.pos);scene.add(pl);}
  for(const p of spec.prims||[])scene.add(primitive(p));
  const models={},mixers={};
  for(const o of spec.models||[]){
    const asset=await gltf(o.url),obj=o.skinned?cloneSkinned(asset.scene):asset.scene.clone(true);
    obj.traverse(m=>{if(m.isMesh){m.castShadow=o.castShadow??true;m.receiveShadow=true;}});
    let holder=obj;
    if(!o.raw){ // fit and drop on the floor; raw keeps the authored placement (rooms carry their own camera)
      obj.updateMatrixWorld(true);let box=new T.Box3().setFromObject(obj),size=box.getSize(new T.Vector3());
      const s=o.height?o.height/size.y:o.width?o.width/size.x:(o.scale||1);obj.scale.multiplyScalar(s);
      obj.updateMatrixWorld(true);box=new T.Box3().setFromObject(obj);const c=box.getCenter(new T.Vector3());
      holder=new T.Group();holder.add(obj);obj.position.sub(new T.Vector3(o.center===false?0:c.x,box.min.y,o.center===false?0:c.z));
    }
    holder.position.fromArray(o.pos||[0,0,0]);holder.rotation.y=o.rotY||0;scene.add(holder);
    if(asset.animations?.length&&(o.pose||o.frames)){const mixer=new T.AnimationMixer(obj);mixers[o.name]={mixer,clips:asset.animations,obj};if(o.pose){const clip=asset.animations.find(c=>c.name===o.pose);if(clip){const a=mixer.clipAction(clip);a.setLoop(T.LoopOnce);a.clampWhenFinished=true;a.play();mixer.setTime(o.poseTime||0);}}}
    holder.updateMatrixWorld(true);applyOps(holder,o.ops);models[o.name||o.url]={holder,obj,asset};
  }
  return {scene,models,mixers,sun};
}
function makeCamera(spec,models,W,H){
  const cam=spec.camera;let camera;
  if(cam.node){ // a camera authored inside a GLB (fire-rooms: camera_game, orthographic)
    const m=models[cam.model],src=m.asset.cameras?.[0]||null;let node=null;m.holder.traverse(n=>{if(n.isCamera&&(!cam.node||n.name===cam.node||n.parent?.name===cam.node))node=n;});
    if(!node)throw Error('no camera '+cam.node);node.updateMatrixWorld(true);
    if(node.isOrthographicCamera){const half=(node.top-node.bottom)/2*(cam.zoom||1);camera=new T.OrthographicCamera(-half*W/H,half*W/H,half,-half,node.near,node.far);}
    else{camera=new T.PerspectiveCamera(node.fov,W/H,node.near,node.far);}
    camera.position.setFromMatrixPosition(node.matrixWorld);camera.quaternion.setFromRotationMatrix(new T.Matrix4().extractRotation(node.matrixWorld));
    if(cam.shiftY)camera.position.y+=cam.shiftY;
  }else if(cam.ortho){const s=cam.ortho/2;camera=new T.OrthographicCamera(-s*W/H,s*W/H,s,-s,.05,400);camera.position.fromArray(cam.pos);camera.lookAt(new T.Vector3(...cam.look));}
  else{camera=new T.PerspectiveCamera(cam.fov||40,W/H,.05,400);camera.position.fromArray(cam.pos);camera.lookAt(new T.Vector3(...cam.look));}
  camera.updateProjectionMatrix();camera.updateMatrixWorld(true);return camera;
}
let renderer=null;
function draw(scene,camera,W,H,spec){
  if(!renderer){renderer=new T.WebGLRenderer({antialias:true,alpha:true,preserveDrawingBuffer:true});renderer.setPixelRatio(1);renderer.outputColorSpace=T.SRGBColorSpace;renderer.toneMapping=T.ACESFilmicToneMapping;renderer.shadowMap.enabled=true;renderer.shadowMap.type=T.PCFSoftShadowMap;}
  renderer.setSize(W,H);renderer.toneMappingExposure=spec.exposure??1.0;renderer.setClearColor(0x000000,0);
  renderer.render(scene,camera);const c=document.createElement('canvas');c.width=W;c.height=H;c.getContext('2d').drawImage(renderer.domElement,0,0);return c;
}
const pixels=c=>c.getContext('2d').getImageData(0,0,c.width,c.height);
window.render=async spec=>{
  const W=spec.w,H=spec.h,{scene,models,mixers}=await buildScene(spec),camera=makeCamera(spec,models,W,H);
  const proj=p=>{const v=new T.Vector3(...p).project(camera);return [+((v.x+1)/2*W).toFixed(1),+((1-v.y)/2*H).toFixed(1)];};
  const world=(model,name,offset=[0,0,0])=>{const n=models[model]?.holder.getObjectByName(name);if(!n)return null;const v=new T.Vector3();n.getWorldPosition(v);return v.add(new T.Vector3(...offset)).toArray();};
  const boxOf=(model,name)=>{const n=models[model]?.holder.getObjectByName(name);if(!n)return null;const b=new T.Box3();n.traverse(m=>{if(m.isMesh&&m.visible&&m.scale.x!==0){m.geometry.computeBoundingBox();b.union(m.geometry.boundingBox.clone().applyMatrix4(m.matrixWorld));}});if(b.isEmpty())return null;const pts=[];for(const x of [b.min.x,b.max.x])for(const y of [b.min.y,b.max.y])for(const z of [b.min.z,b.max.z])pts.push(proj([x,y,z]));return [Math.min(...pts.map(p=>p[0])),Math.min(...pts.map(p=>p[1])),Math.max(...pts.map(p=>p[0])),Math.max(...pts.map(p=>p[1]))];};
  const info={points:{},boxes:{},overlays:{},frames:null};
  for(const [k,v]of Object.entries(spec.points||{}))info.points[k]=proj(v);
  for(const [k,v]of Object.entries(spec.nodes||{})){const p=world(v.model,v.node,v.offset);if(p)info.points[k]=proj(p);}
  for(const [k,v]of Object.entries(spec.boxes||{})){const b=boxOf(v.model,v.node);if(b)info.boxes[k]=b;}
  for(const [k,v]of Object.entries(spec.extras||{})){const n=models[v.model]?.holder.getObjectByName(v.node);if(n&&v.state){const st=n.userData?.states?.[v.state];if(st?.translation){const parent=n.parent;parent.updateMatrixWorld(true);const p=new T.Vector3(...st.translation).applyMatrix4(parent.matrixWorld);info.points[k]=proj(p.toArray());}}}
  if(spec.frames){ // animation frame sheet: same camera, one cell per time, union crop shared by all frames
    const f=spec.frames,mx=mixers[f.model];const canvases=[];
    for(const t of f.times){mx.mixer.stopAllAction();const clip=mx.clips.find(c=>c.name===f.clip);const a=mx.mixer.clipAction(clip);a.reset();a.setLoop(f.loop?T.LoopRepeat:T.LoopOnce);a.clampWhenFinished=true;a.play();mx.mixer.setTime(t);mx.obj.updateMatrixWorld(true);canvases.push(draw(scene,camera,W,H,spec));}
    let x0=W,y0=H,x1=0,y1=0;for(const c of canvases){const d=pixels(c).data;for(let y=0;y<H;y++)for(let x=0;x<W;x++)if(d[(y*W+x)*4+3]>8){if(x<x0)x0=x;if(y<y0)y0=y;if(x>x1)x1=x;if(y>y1)y1=y;}}
    const pad=4;x0=Math.max(0,x0-pad);y0=Math.max(0,y0-pad);x1=Math.min(W,x1+pad+1);y1=Math.min(H,y1+pad+1);const cw=x1-x0,ch=y1-y0,sheet=document.createElement('canvas');sheet.width=cw*canvases.length;sheet.height=ch;
    canvases.forEach((c,i)=>sheet.getContext('2d').drawImage(c,x0,y0,cw,ch,i*cw,0,cw,ch));
    info.frames={count:canvases.length,cell:[cw,ch],origin:[x0,y0],times:f.times};return {url:sheet.toDataURL('image/png'),info};
  }
  const base=draw(scene,camera,W,H,spec);
  for(const v of spec.overlays||[]){ // what changes when one thing changes state (burnt window, burnt sofa, open door), cut out with its own occlusion
    const m=models[v.model];applyOps(m.holder,v.ops);const changed=draw(scene,camera,W,H,spec);applyOps(m.holder,v.undo);
    const a=pixels(base).data,bd=pixels(changed),b=bd.data,mask=new Uint8Array(W*H);
    for(let i=0;i<W*H;i++){const j=i*4;if(Math.abs(a[j]-b[j])+Math.abs(a[j+1]-b[j+1])+Math.abs(a[j+2]-b[j+2])+Math.abs(a[j+3]-b[j+3])>(v.threshold??18))mask[i]=1;}
    let x0=W,y0=H,x1=-1,y1=-1;const grown=new Uint8Array(W*H);
    for(let y=0;y<H;y++)for(let x=0;x<W;x++){if(!mask[y*W+x])continue;for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){const X=x+dx,Y=y+dy;if(X>=0&&Y>=0&&X<W&&Y<H)grown[Y*W+X]=1;}}
    for(let y=0;y<H;y++)for(let x=0;x<W;x++)if(grown[y*W+x]){if(x<x0)x0=x;if(y<y0)y0=y;if(x>x1)x1=x;if(y>y1)y1=y;}
    if(x1<0){info.overlays[v.name]=null;continue;}
    const cw=x1-x0+1,ch=y1-y0+1,out=document.createElement('canvas');out.width=cw;out.height=ch;const og=out.getContext('2d'),img=og.createImageData(cw,ch);
    for(let y=0;y<ch;y++)for(let x=0;x<cw;x++){const i=(y+y0)*W+(x+x0),j=i*4,k=(y*cw+x)*4;if(grown[i]){img.data[k]=b[j];img.data[k+1]=b[j+1];img.data[k+2]=b[j+2];img.data[k+3]=b[j+3];}}
    og.putImageData(img,0,0);info.overlays[v.name]={url:out.toDataURL('image/webp',.9),origin:[x0,y0],size:[cw,ch]};
  }
  return {url:base.toDataURL('image/png'),info};
};
window.ready=true;
</script></body></html>
