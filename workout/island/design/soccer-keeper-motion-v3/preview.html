<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">

  <title>בין הקורות · תנועות כדורגל</title>

  <script type="importmap">{"imports":{"three":"../soccer-motion-v8/runtime/vendor/three.module.js"}}</script>
</head>
<body>
  <header><div class="brand"><span class="brand-mark" aria-hidden="true">◈</span><div><p>כדורגל · ספריית תנועה 03</p><h1>בין הקורות.</h1></div></div><div class="header-meta"><span>14 תנועות <i>·</i> 30 הרץ</span><a href="./REPORT.md">דוח הבדיקה</a></div></header>
  <main>
    <aside aria-label="בחירת תנועה"><div class="library-head"><h2>ספריית התנועות</h2><span id="clip-count">14</span></div><div id="clips" class="clip-list"></div><a class="license-link" href="./LICENSES.md">מקורות ורישיונות</a></aside>
    <section class="workspace" aria-label="תצוגת תנועה">
      <div class="stage"><canvas id="stage" aria-label="שחקן תלת ממדי מבצע את התנועה הנבחרת"></canvas><div class="stage-heading"><span class="live-dot"></span><span id="role">שוער</span><span id="phase">טוען תנועה…</span></div><div class="view-controls" aria-label="זווית צפייה"><button type="button" data-view="three" aria-pressed="true">¾</button><button type="button" data-view="front" aria-pressed="false">מלפנים</button><button type="button" data-view="side" aria-pressed="false">מהצד</button></div><div class="stage-title"><p id="subtitle">דריכות, תגובה והבעה</p><h2 id="title">טוען את הספרייה…</h2></div><div class="stage-info"><span id="team-note"></span><span>18 עצמות</span></div><p id="error" role="alert" hidden></p></div>
      <div class="transport"><div class="transport-row"><button id="play" class="primary" type="button" aria-label="השהיה">השהיה</button><button id="restart" type="button" aria-label="התחלה מחדש">מחדש</button><label for="speed">מהירות <select id="speed"><option value="0.25">×0.25</option><option value="0.5">×0.5</option><option value="1" selected>×1</option></select></label><div class="display-options"><label><input id="ball" type="checkbox" checked> כדור</label><label><input id="skeleton" type="checkbox"> שלד</label></div><output id="time">0.00 / 0.00</output></div><div class="timeline"><input id="scrub" type="range" min="0" max="1" value="0" step="1" aria-label="פריים בתנועה"><span id="frame">0</span></div></div>
      <div class="detail"><p id="description"></p><div id="events" class="events" aria-label="רגעים בתנועה"></div><a id="sheet-link" href="./sheets/keeper_ready.png">גיליון 8 פריימים</a></div>
    </section>
  </main>
  <script type="module" src="./preview.mjs"></script>
