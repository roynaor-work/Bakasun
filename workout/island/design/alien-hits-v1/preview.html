8;background:#342824;font-size:11px;min-height:28px}.toolbar{position:absolute;left:20px;right:20px;bottom:16px;height:42px;display:flex;gap:7px;align-items:center;direction:rtl;border-top:1px solid #24374a;padding-top:10px}.toolbar button{font-size:11px;min-height:30px}.toolbar label{display:flex;gap:5px;align-items:center;font-size:11px;white-space:nowrap}.toolbar input{accent-color:#81d8ee}#speed{font-size:11px;width:90px;min-height:30px}#status{margin-inline-start:auto;font-size:10px;color:#8fabc0;direction:rtl;max-width:180px}#soundButtons{display:flex;gap:4px;direction:ltr}#soundButtons button{min-width:29px;padding:3px 6px;font-size:10px}#error{display:none;position:absolute;inset:75px 30px 70px;padding:30px;background:#251b21;color:#ffd5c6;z-index:10;line-height:1.7;font-size:15px}a{color:#9ce6fa}#stage.loading canvas{opacity:.3}.loading #status{color:#ffce82}#caption{position:absolute;top:242px;left:40px;width:480px;text-align:center;color:#d7e6f2;font-size:12px;direction:rtl}#tag{position:absolute;top:107px;left:38px;padding:4px 7px;border:1px solid #34586b;border-radius:20px;color:#83d9e9;font-size:9px;direction:ltr}.visuallyHidden{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
