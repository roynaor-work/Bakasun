<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b171d">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="אצטדיון כדורגל בתלת ממד, תאורת יום וערב, דשא וקהל חי.">
  <title>האצטדיון · כדורגל 06</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="preview.css">
</head>
<body>
  <main class="arena">
    <div id="stage" aria-label="אצטדיון תלת ממדי עם דשא, יציעים וקהל"></div>
    <header>
      <a class="identity" href="preview.html" aria-label="האצטדיון, מבט פתיחה"><span class="edition">06</span><span>האצטדיון<small>כדורגל / האי שלי</small></span></a>
      <div class="live"><i></i> ערב של כדורגל</div>
      <a class="report" href="REPORT.md" aria-label="פתיחת דוח הנכסים">דוח <span class="arrow" aria-hidden="true"></span></a>
    </header>
    <div class="scoreboard" aria-label="שידור הדגמה, בית אפס חוץ אפס">
      <span class="team home">בית</span><b>0 <em>:</em> 0</b><span class="team away">חוץ</span><time>12:48</time>
    </div>
    <div class="view-tag"><span class="reticle" aria-hidden="true"></span><span id="view-label">מצלמת שידור</span><span class="divider">/</span><span id="light-label">תאורת ערב</span></div>
    <div id="loading" role="status"><span class="loader"></span><span>מדליקים את האצטדיון…</span></div>
    <section class="caption" aria-label="תצוגת האצטדיון">
      <span class="eyebrow">מגרש אחד. אלפי רגעים.</span>
      <h1><span>המשחק מתחיל</span> <span>באור הנכון.</span></h1>
      <p>דשא חי · שני מפלסי יציעים · קהל בתנועה</p>
    </section>
    <nav class="controls" aria-label="אפשרויות תצוגה">
      <div class="control-main">
        <div class="segment lights" role="group" aria-label="שעת היום">
          <button data-mode="day" aria-pressed="false"><svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="4"/><path d="M10 1v2m0 14v2M1 10h2m14 0h2M4 4l1 1m10 10 1 1M4 16l1-1M15 5l1-1"/></svg> יום</button>
          <button data-mode="evening" aria-pressed="true"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M14 2a8 8 0 1 0 4 12A8 8 0 0 1 14 2Z"/></svg> ערב</button>
        </div>
        <div class="segment cameras" role="group" aria-label="בחירת מצלמה">
          <button data-view="broadcast" aria-pressed="true">שידור</button>
          <button data-view="goal" aria-pressed="false">שער</button>
          <button data-view="turf" aria-pressed="false">דשא</button>
          <button data-view="stands" aria-pressed="false">יציעים</button>
        </div>
      </div>
      <div class="control-sub">
        <span class="condition"><i></i><span id="condition-label">מגרש יבש</span></span>
        <div class="actions">
          <button id="wet" aria-pressed="false">מים על הדשא</button>
          <button id="burst">אבק</button>
          <button id="pause" aria-pressed="false" aria-label="עצירת התנועה">עצירה</button>
        </div>
        <span class="scale">6 מול 6</span>
      </div>
    </nav>
    <span class="corner-note" aria-hidden="true">105 × 68 M / OPEN AIR</span>
  </main>
  <script type="module" src="preview.mjs"></script>
</body>
</html>
