<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<title>Hoops Motion 09 · ספריית תנועה</title>
<style>
:root{--ink:#152325;--muted:#6e7b79;--line:#dce3df;--paper:#f4f5ef;--white:#fff;--green:#284c42;--accent:#e67443;--soft:#e5eee7;font-family:Arial,"Noto Sans Hebrew",sans-serif;color:var(--ink);background:var(--paper);font-synthesis:none}*{box-sizing:border-box}html,body{margin:0;min-height:100%;width:100%;overflow-x:hidden}button,select,input{font:inherit}button,select{cursor:pointer}button{border:1px solid var(--line);background:var(--white);color:var(--ink);border-radius:7px;min-height:30px}button:hover{border-color:#81958b}button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid #e6744388;outline-offset:2px}button:disabled{opacity:.45;cursor:wait}button[aria-pressed=true]{background:var(--green);color:white;border-color:var(--green)}.app{width:100%;height:100dvh;min-height:390px;max-height:1100px;display:grid;grid-template-rows:62px 1fr}.topbar{display:flex;align-items:center;justify-content:space-between;padding:0 22px;background:var(--paper);border-bottom:1px solid var(--line);gap:18px}.brand{display:flex;align-items:center;gap:11px}.mark{width:30px;height:30px;border:1.5px solid var(--green);border-radius:50%;position:relative;overflow:hidden;transform:rotate(-18deg)}.mark:before,.mark:after{content:"";position:absolute;inset:0;display:block;border-radius:50%;border:1px solid var(--green)}.mark:before{left:10px;right:10px;border-radius:0;border-top:0;border-bottom:0}.mark:after{top:13px;bottom:auto;height:0;border-left:0;border-right:0;border-bottom:0}.brand h1{font-size:16px;font-weight:700;margin:0;letter-spacing:-.3px}.brand p{font-size:10px;color:var(--muted);margin:4px 0 0}.edition{display:flex;align-items:center;gap:8px;direction:ltr;color:var(--muted);font-size:10px;letter-spacing:1.2px}.edition strong{color:var(--green);font-size:22px;font-weight:400;letter-spacing:-1px}.workspace{display:grid;grid-template-columns:246px minmax(0,1fr);min-height:0;direction:rtl}.library{background:#fbfcf8;border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0;padding:15px 14px 0}.library-head{display:flex;align-items:baseline;justify-content:space-between}.library-head h2{font-size:12px;margin:0 0 12px}.count{font-size:10px;direction:ltr;color:var(--muted)}.search-wrap{position:relative;margin-bottom:10px}.search-wrap input{border:1px solid var(--line);border-radius:7px;padding:7px 10px;width:100%;background:white;font-size:11px;color:var(--ink);outline:none}.filters{display:flex;gap:4px;padding-bottom:10px}.filters button{font-size:10px;padding:4px 8px;min-height:27px;white-space:nowrap}.clip-list{overflow:auto;scrollbar-width:thin;scrollbar-color:#c4d0c7 transparent;flex:1;padding:0 0 12px;display:flex;flex-direction:column;gap:4px}.clip-item{padding:8px 9px;text-align:right;display:grid;grid-template-columns:1fr auto;gap:2px 7px;min-height:47px;flex-shrink:0;border:1px solid transparent;background:transparent;position:relative}.clip-item strong{font-size:11px;line-height:1.35;font-weight:500}.clip-item small{font-size:8px;direction:ltr;text-align:right;opacity:.67;line-height:1.3;overflow-wrap:anywhere}.clip-item .clip-duration{grid-column:2;grid-row:1/3;align-self:center;font-size:9px;direction:ltr;opacity:.65}.clip-item[aria-pressed=true]{background:#e5eee7;color:var(--ink);border-color:#cadbce}.clip-item[aria-pressed=true]:after{content:"";width:3px;position:absolute;right:-1px;top:8px;bottom:8px;background:var(--green);border-radius:3px}.stage-wrap{min-width:0;min-height:0;position:relative;background:#eaece3;overflow:hidden;display:grid;grid-template-rows:minmax(0,1fr) 58px}.stage{position:relative;overflow:hidden;min-height:240px}.stage canvas{display:block;width:100%;height:100%}.stage-top{position:absolute;top:18px;right:22px;left:22px;display:flex;align-items:flex-start;justify-content:space-between;pointer-events:none;gap:12px}.stage-name h2{font-size:20px;margin:0;font-weight:500;letter-spacing:-.65px}.stage-name p{font-size:9px;color:#62716a;margin:5px 0 0;direction:ltr;text-align:right;letter-spacing:.6px}.format-pill{font-size:9px;border:1px solid #aebdb29c;padding:5px 7px;border-radius:4px;color:#496151;background:#f7faf0aa;direction:ltr;white-space:nowrap}.stage-bottom{position:absolute;bottom:12px;right:20px;left:20px;display:flex;justify-content:space-between;align-items:end;pointer-events:none}.phase{font-size:10px;color:var(--green);padding:5px 8px;border:1px solid #c0d0c3;background:#ffffffb8;border-radius:4px;max-width:65%}.phase b{font-size:8px;letter-spacing:1px;font-weight:400;direction:ltr;display:block;opacity:.5;margin-bottom:2px}.stage-note{font-size:8px;line-height:1.7;text-align:left;direction:ltr;color:#6f8074}.controls{background:#fbfcf8;border-top:1px solid var(--line);display:grid;grid-template-columns:auto minmax(50px,1fr) auto;align-items:center;gap:12px;padding:8px 17px;direction:ltr}.transport{display:flex;align-items:center;gap:5px}.transport button{width:30px;height:30px;padding:0;display:grid;place-items:center;font-size:12px}.transport .play{background:var(--green);border-color:var(--green);color:white}.timeline{display:grid;grid-template-rows:15px 14px;align-items:center}.timeline input{width:100%;height:3px;accent-color:var(--green);margin:0;cursor:ew-resize;direction:ltr}.time-row{display:flex;justify-content:space-between;color:#829087;font-size:8px;font-variant-numeric:tabular-nums}.options{display:flex;gap:5px;align-items:center}.options select{background:transparent;border:1px solid var(--line);border-radius:5px;font-size:9px;color:#526759;height:28px;max-width:105px;padding:0 4px}.status{position:absolute;left:50%;top:54%;transform:translate(-50%,-50%);padding:9px 13px;font-size:11px;border-radius:5px;background:#fcfff1ed;box-shadow:0 5px 30px #193b2111;color:var(--green);text-align:center;max-width:80%}.status.error{background:#fff0e8;color:#9f4923}.status[hidden]{display:none}.legend{direction:ltr;font-variant-numeric:tabular-nums}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}.capture .app{display:block;height:100dvh;min-height:0}.capture .topbar,.capture .library,.capture .controls,.capture .stage-top,.capture .stage-bottom{display:none}.capture .workspace,.capture .stage-wrap,.capture .stage{height:100%;display:block;min-height:0;width:100%}.capture .status{display:none}
@media(min-width:1100px){.workspace{grid-template-columns:300px minmax(0,1fr)}.topbar{padding-inline:30px}.library{padding:22px 20px 0}.clip-item strong{font-size:12px}.stage-name h2{font-size:26px}.stage-top{right:30px;left:30px;top:25px}.controls{height:68px;padding-inline:25px}.stage-wrap{grid-template-rows:minmax(0,1fr) 68px}}
@media(max-width:620px){.app{height:auto;max-height:none;min-height:100dvh;grid-template-rows:62px 1fr}.topbar{padding:0 16px}.edition{font-size:8px}.edition span{display:none}.brand h1{font-size:14px}.brand p{font-size:9px;white-space:nowrap}.mark{width:27px;height:27px;flex-shrink:0}.workspace{display:flex;flex-direction:column-reverse;min-height:0}.stage-wrap{height:66dvh;min-height:340px;flex-shrink:0;grid-template-rows:minmax(0,1fr) 65px}.stage-top{right:16px;left:16px;top:16px}.stage-name h2{font-size:20px}.stage{min-height:260px}.library{border-left:0;border-top:1px solid var(--line);padding:16px;max-height:55dvh;min-height:280px}.clip-list{display:grid;grid-template-columns:1fr 1fr;align-content:start;gap:4px}.controls{gap:8px;padding:9px 10px}.options select{max-width:88px;font-size:8px}.stage-note{font-size:7px}.clip-item{min-height:49px}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
</head>
<body>
<main class="app">
<header class="topbar"><div class="brand"><span class="mark" aria-hidden="true"></span><div><h1>ספריית תנועה · כדורסל</h1><p>ביצועים מקוריים. גוף שלם. תנועה טבעית.</p></div></div><div class="edition"><span>HOOPS / MOTION LIBRARY</span><strong>09</strong></div></header>
<div class="workspace">
<aside class="library" aria-label="בחירת קליפ"><div class="library-head"><h2>קטלוג התנועות</h2><span id="count" class="count"></span></div><div class="search-wrap"><label for="search" class="sr-only">חיפוש קליפ</label><input id="search" type="search" placeholder="חיפוש תנועה…" autocomplete="off"></div><nav class="filters" aria-label="סינון תנועות"><button data-group="all" aria-pressed="true">הכול</button><button data-group="locomotion" aria-pressed="false">תנועה</button><button data-group="attack" aria-pressed="false">התקפה</button><button data-group="actions" aria-pressed="false">יתר הפעולות</button></nav><div id="clips" class="clip-list" aria-label="קליפים"></div></aside>
<section class="stage-wrap" aria-label="תצוגת התנועה"><div class="stage" id="stage"><div class="stage-top"><div class="stage-name"><h2 id="clip-title">טוען את המגרש…</h2><p id="clip-id">ORIGINAL PERFORMANCE / CANONICAL 18</p></div><span class="format-pill">GLB · DRACO · 30 Hz</span></div><div class="stage-bottom"><div id="phase" class="phase"><b>PERFORMANCE</b><span>תנועה מקורית</span></div><div class="stage-note">18 BONES · METERS<br><span id="root-note">IN-PLACE / HOST-OWNED ROOT</span></div></div><div class="status" id="status" role="status" aria-live="polite">טוען את ספריית התנועה…</div></div><div class="controls"><div class="transport"><button id="restart" aria-label="התחלה מחדש" title="התחלה מחדש">↺</button><button id="play" class="play" aria-label="השהיה" title="השהיה">Ⅱ</button></div><div class="timeline"><label for="scrub" class="sr-only">מיקום בקליפ</label><input id="scrub" type="range" min="0" max="1" step="0.001" value="0"><div class="time-row"><span id="time">0.00s</span><span id="duration">—</span></div></div><div class="options"><label for="speed" class="sr-only">מהירות</label><select id="speed" title="מהירות ניגון"><option value="0.25">0.25×</option><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="1.5">1.5×</option></select><label for="root-mode" class="sr-only">מצב תנועת שורש</label><select id="root-mode" title="תנועת עולם"><option value="in-place">במקום</option><option value="reference">מסלול ייחוס</option></select></div></div></section>
</div>
</main>
<script type="module" src="./preview.mjs"></script>
</body>
</html>
