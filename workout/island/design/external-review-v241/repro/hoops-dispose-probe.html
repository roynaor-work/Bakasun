<!doctype html><meta charset="utf-8"><title>Hoops GPU disposal probe</title><canvas width="64" height="64"></canvas><script type="module">
import * as T from '../../../vendor/three.module.js';
import {GLTFLoader} from '../../../vendor/GLTFLoader.js';
import {loadHoopsGLTF} from '../../../minigames/hoops-gltf.mjs';
import {seatingLayout} from '../../../minigames/hoops-v8-venue.mjs';
import {createHoopsCrowd3d,hoopsCrowdSeats,hoopsCrowdBudget} from '../../../minigames/hoops-crowd3d.mjs';
