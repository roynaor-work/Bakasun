<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Ccircle cx=%2716%27 cy=%2716%27 r=%2714%27 fill=%27%23d8ea59%27/%3E%3C/svg%3E">
  <title>צוות המגרש · טניס</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{background:#112622;color:#f2eddc;font:13px system-ui,sans-serif}button,select,input{font:inherit}button,select{border:1px solid #4c665a;background:#1d3931;color:#f7f2e3;border-radius:8px;min-height:34px;padding:0 12px}button{cursor:pointer}button:hover,select:hover{background:#2e5143}button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid #efb36e;outline-offset:2px}header{height:54px;padding:8px 18px;display:flex;align-items:center;gap:14px;border-bottom:1px solid #41584a}h1{font-size:18px;margin:0;font-weight:650;letter-spacing:-.5px}.eyebrow{color:#d9b57b;font-size:10px;letter-spacing:1.5px}.subtitle{font-size:11px;color:#b1c4b6;margin-top:2px}.brand{margin-left:auto}.stat{padding-right:14px;border-right:1px solid #49604f;font-size:11px;color:#b7c9bd}.stat strong{color:#f0e7d2;font-size:15px;display:block}main{height:calc(100% - 112px);min-height:100px;position:relative;background:#d5d1b7}canvas{display:block;width:100%;height:100%;touch-action:none}#loading{position:absolute;inset:0;background:#16372f;display:grid;place-items:center;font-size:16px;color:#e9dcc3;z-index:4}#error{display:none;position:absolute;inset:15px;background:#412d2a;border:1px solid #bd7865;border-radius:10px;padding:20px;z-index:8;white-space:pre-wrap}#caption{position:absolute;right:16px;top:12px;border:1px solid #ffffff24;background:#17372edb;border-radius:8px;padding:7px 12px;pointer-events:none}#caption strong{font-size:12px}#caption span{display:block;color:#c2d2c7;font-size:10px;margin-top:2px}#hint{position:absolute;left:14px;bottom:12px;color:#f9f4e4;background:#17372ecb;padding:5px 10px;border-radius:20px;font-size:10px;pointer-events:none}#orbit{position:absolute;left:14px;top:12px;display:flex;gap:5px;direction:ltr}#orbit button{width:30px;min-height:30px;padding:0;background:#17372edb;border-color:#ffffff33}footer{height:58px;padding:10px 12px;display:flex;gap:8px;align-items:center;direction:rtl;border-top:1px solid #46604f}select{min-width:135px;max-width:180px}#clip{min-width:147px}#play{min-width:56px;padding:0 7px}#timeline{flex:1;min-width:35px;accent-color:#d7b67a;direction:ltr}#time{font-variant-numeric:tabular-nums;font-size:10px;min-width:62px;color:#c4d2c5;direction:ltr}#audio{min-width:65px;padding:0 8px}#sound{min-width:100px;max-width:112px;font-size:11px}#soundTest{padding:0 8px}a{color:#d7b67a}button[aria-pressed=true]{border-color:#d7b67a;color:#f2ce8f}@media(max-width:720px){.stat,.subtitle,#sound,#soundTest{display:none}header{height:48px;padding:6px 12px}main{height:calc(100% - 102px)}footer{height:54px;gap:5px;padding:8px}select{min-width:110px;max-width:145px;font-size:11px;padding:0 6px}#clip{min-width:122px}#caption{right:10px;top:10px}#time{min-width:45px}#audio{min-width:55px;font-size:11px}}@media(max-width:470px){#time,#hint{display:none}header h1{font-size:16px}#audio{min-width:35px;font-size:10px}#play{min-width:43px}select{min-width:94px;max-width:110px}#clip{min-width:108px}footer{gap:4px;padding:6px}}
  </style>
</head>
<body>
  <header>
    <div class="brand"><div class="eyebrow">ISLAND / TENNIS</div><h1>צוות המגרש</h1></div>
    <div class="subtitle">שיפוט חד. תנועה שקטה. כל פרט במקומו.</div>
    <div class="stat"><strong>7</strong>דמויות</div>
    <div class="stat"><strong>18</strong>עצמות לדמות</div>
    <div class="stat"><strong>30 Hz</strong>קליפים</div>
  </header>
  <main id="stage" aria-label="תצוגת תלת־ממד של צוות הטניס">
    <div id="loading" role="status">מכינים את המגרש…</div>
    <div id="error" role="alert"></div>
    <div id="caption"><strong id="captionTitle">סביב המגרש</strong><span id="captionText">שופט כיסא · 2 שופטי קו · 4 ילדי כדורים</span></div>
    <div id="orbit"><button id="orbitLeft" aria-label="סיבוב מצלמה שמאלה">↶</button><button id="orbitRight" aria-label="סיבוב מצלמה ימינה">↷</button><button id="resetView" aria-label="איפוס מצלמה">⌂</button></div>
    <div id="hint">בחרו דמות כדי לבחון תנועה מקרוב</div>
  </main>
  <footer aria-label="בקרי תצוגה">
    <select id="actor" aria-label="דמות"></select>
    <select id="clip" aria-label="תנועה"></select>
    <button id="play" aria-pressed="true">עצירה</button>
    <input id="timeline" aria-label="מיקום בתנועה" type="range" min="0" max="1" value="0" step="0.001">
    <output id="time">0.00 / 0.00</output>
    <button id="audio" aria-pressed="false">קול כבוי</button>
    <select id="sound" aria-label="צליל לבדיקה"><option value="line-out">אאוט</option><option value="line-good">טוב</option><option value="ball-roll">גלגול</option><option value="applause-soft">מחיאות</option></select>
    <button id="soundTest" aria-label="השמעת הצליל שנבחר">השמע</button>
  </footer>
  <script type="module" src="./source/preview.mjs"></script>
</body>
</html>
