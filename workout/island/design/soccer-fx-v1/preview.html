<script type="module">
const paths={play:'m9 5 11 7-11 7z',pause:'M8 5v14M16 5v14',step:'m5 5 10 7-10 7zM19 5v14',restart:'M5 9a8 8 0 1 1-1 6M5 3v6h6',sheets:'M3 3h18v18H3zM9 3v18M15 3v18M3 9h18M3 15h18',background:'M12 3v18M12 3a9 9 0 1 1 0 18 9 9 0 0 1 0-18',sound:'M3 9h4l5-5v16l-5-5H3zM16 8a6 6 0 0 1 0 8M19 5a10 10 0 0 1 0 14',mute:'M3 9h4l5-5v16l-5-5H3zM16 9l6 6m0-6-6 6',download:'M12 3v12m-5-5 5 5 5-5M4 16v5h16v-5',file:'M5 3h9l5 5v13H5zM14 3v6h5M8 13h8M8 17h8',license:'M12 3 3 7v5c0 5 9 9 9 9s9-4 9-9V7zM8 12l3 3 5-6',landing:'M12 3v11m-4-4 4 4 4-4M3 20l4-3m14 3-4-3M9 20h6',slide:'M5 5l5 4 5-1M10 9l-4 7H2m8-7 7 8h5M4 21h16',confetti:'m3 21 4-12 8 8zM10 3l2 3m7 1 2-2M17 12l4 1M7 3l-1 3M16 3l-2 6',net:'M3 21V4h18v17M7 4v17m5-17v17m5-17v17M3 10h18M3 16h18',trail:'M2 7h13M2 12h17M2 17h13m2-12 5 7-5 7',ring:'M12 3a9 9 0 1 0 9 9M12 7a5 5 0 1 0 5 5M12 1v4m9 7h-4',click:'M12 2v4M2 12h4m6 6v4m6-10h4M5 5l3 3m8 8 3 3m0-14-3 3M8 16l-3 3',kick:'M12 8v8m-4-4h8M12 1v3m0 16v3M1 12h3m16 0h3M4 4l3 3m10 10 3 3m0-16-3 3M7 17l-3 3',ball:'M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18m0 5 5 4-2 6H9l-2-6z',catch:'M3 12V7a1 1 0 0 1 2 0v4-7a1 1 0 0 1 2 0v7-8a1 1 0 0 1 2 0v8-6a1 1 0 0 1 2 0v8l3-2 2 1-5 8H6zM18 3a3 3 0 1 0 0 6 3 3 0 0 0 0-6',ogg:'M12 4a8 8 0 1 0 0 16 8 8 0 0 0 0-16m-2 4 6 4-6 4z',mp3:'m12 2 10 10-10 10L2 12zm-2 6 6 4-6 4z'};
const icon=n=>`<svg viewBox="0 0 24 24" aria-hidden="true"><path d="${paths[n]||paths.ball}"/></svg>`;
for(const n of ['step','restart','sheets','background','mute'])document.getElementById(n).innerHTML=icon(n==='mute'?'sound':n);
for(const [id,n]of [['manifest-link','file'],['report-link','file'],['license-link','license']])document.getElementById(id).innerHTML=icon(n);
const names={'landing-turf':['אבק ודשא בנחיתה','landing'],'slide-turf':['אבק ודשא בגלישה','slide'],'goal-confetti':['קונפטי שער בחיבור אור','confetti'],'goal-net-ripple':['ריצוד רשת','net'],'ball-trail':['זנב כדור מחזורי','trail'],'selected-player-ring':['טבעת שחקן נבחר','ring'],'click-ring':['טבעת לחיצה','click'],'power-kick':['קווי בעיטה חזקה','kick']};
const soundNames={'kick-soft':['בעיטה רכה','ball'],'kick-strong':['בעיטה חזקה','kick'],'post-hit':['פגיעה בעמוד','net'],'crossbar-hit':['פגיעה בקורה','net'],'ball-land':['כדור בנחיתה','landing'],'net-rustle':['רשת רוטטת','net'],'keeper-catch':['תפיסת שוער','catch']};

const play=document.getElementById('play'),timeline=document.getElementById('timeline'),volume=document.getElementById('volume'),scene=document.getElementById('scene'),ctx=scene.getContext('2d');
function setPlay(v){playing=v;play.setAttribute('aria-pressed',String(v));play.setAttribute('aria-label',v?'השהיית האנימציה':'הפעלת האנימציה');play.title=play.getAttribute('aria-label');play.innerHTML=icon(v?'pause':'play')}
setPlay(playing);
play.onclick=()=>setPlay(!playing);
document.getElementById('step').onclick=()=>{setPlay(false);time=(time+1000/24)%4000;render()};
document.getElementById('restart').onclick=()=>{time=0;render()};
timeline.oninput=()=>{setPlay(false);time=Number(timeline.value);render()};
document.getElementById('sheets').onclick=e=>{sheets=!sheets;e.currentTarget.setAttribute('aria-pressed',String(sheets));render()};
document.getElementById('background').onclick=e=>{const v=document.body.classList.toggle('light');e.currentTarget.setAttribute('aria-pressed',String(v));render()};
document.getElementById('mute').onclick=e=>{muted=!muted;e.currentTarget.setAttribute('aria-pressed',String(muted));e.currentTarget.innerHTML=icon(muted?'mute':'sound');if(currentAudio)currentAudio.muted=muted};
volume.oninput=()=>{if(currentAudio)currentAudio.volume=Number(volume.value)};
function failed(el){el.classList.add('failed');const s=document.getElementById('status');s.style.display='block';s.innerHTML=icon('restart')}
function backdrop(c,w,h){const light=document.body.classList.contains('light');c.fillStyle=light?'#d6ded5':'#102923';c.fillRect(0,0,w,h);const tile=16;for(let x=0;x<w;x+=tile)for(let y=0;y<h;y+=tile)if((x/tile+y/tile)%2===0){c.fillStyle=light?'#e8ece4':'#17372d';c.fillRect(x,y,tile,tile)}}
function sprite(c,id,seconds,x,y,w,h,repeat=false){if(seconds<0)return;const o=items.find(o=>o.s.id===id);if(!o)return;const s=o.s;let f=s.fps?Math.floor(Math.max(0,seconds)*s.fps):0;if(repeat||s.loop)f%=s.frameCount;else if(f>=s.frameCount)return;const r=s.frames[f].rect;c.save();c.globalCompositeOperation=s.blend==='AdditiveBlending'?'lighter':'source-over';c.drawImage(o.img,...r,x-w*s.anchor[0],y-h*s.anchor[1],w,h);c.restore()}
function drawScene(){const w=scene.width,h=scene.height,t=time/1000;const light=document.body.classList.contains('light');ctx.fillStyle=light?'#c6d6ba':'#103e2c';ctx.fillRect(0,0,w,h);for(let i=0;i<10;i++){ctx.fillStyle=light?'#c0d0b4':'#124532';if(i%2===0)ctx.fillRect(i*100,0,100,h)}ctx.strokeStyle=light?'#6c8f71':'#75a68a';ctx.lineWidth=2;ctx.strokeRect(24,24,w-48,h-48);ctx.beginPath();ctx.moveTo(w/2,24);ctx.lineTo(w/2,h-24);ctx.stroke();ctx.beginPath();ctx.arc(w/2,h/2,70,0,Math.PI*2);ctx.stroke();ctx.strokeRect(824,125,130,250);ctx.strokeRect(742,65,212,370);ctx.lineWidth=5;ctx.strokeStyle='#dcefe4';ctx.strokeRect(855,157,95,185);sprite(ctx,'goal-net-ripple',t>1.9?Math.min(t-1.9,7/16):7/16,899,250,160,205);sprite(ctx,'selected-player-ring',t,205,278,88,42,true);if(t<.4)sprite(ctx,'click-ring',t,205,278,120,60);const u=Math.min(1,Math.max(0,(t-.7)/1.2)),bx=225+u*645,by=250-Math.sin(u*Math.PI)*58;if(t>=.7&&t<1.9){const trail=items.find(o=>o.s.id==='ball-trail');if(trail){ctx.save();ctx.globalCompositeOperation='lighter';ctx.translate(bx-88,by);ctx.rotate(-Math.cos(u*Math.PI)*.12);const pattern=ctx.createPattern(trail.img,'repeat');ctx.scale(1,.7);ctx.translate(-((t*512)%256),-16);ctx.fillStyle=pattern;ctx.fillRect((t*512)%256-20,0,110,32);ctx.restore()}}sprite(ctx,'landing-turf',t-.65,215,283,145,105);if(t>=.7)sprite(ctx,'power-kick',t-.7,235,250,125,125);if(t>=1.9)sprite(ctx,'goal-confetti',t-1.9,870,230,290,290);if(t>2.45)sprite(ctx,'slide-turf',t-2.45,680,350,150,100);ctx.save();ctx.translate(bx,by);ctx.rotate(u*15);ctx.fillStyle='#f5fbeb';ctx.beginPath();ctx.arc(0,0,15,0,Math.PI*2);ctx.fill();ctx.fillStyle='#234c3e';ctx.beginPath();for(let i=0;i<5;i++){const a=i*Math.PI*2/5-Math.PI/2;ctx.lineTo(Math.cos(a)*7,Math.sin(a)*7)}ctx.closePath();ctx.fill();ctx.restore()}
function render(){timeline.value=String(Math.round(time));drawScene();for(const o of items){const c=o.canvas.getContext('2d'),w=o.canvas.width,h=o.canvas.height;backdrop(c,w,h);if(sheets){const scale=Math.min((w-12)/o.img.width,(h-12)/o.img.height);c.drawImage(o.img,(w-o.img.width*scale)/2,(h-o.img.height*scale)/2,o.img.width*scale,o.img.height*scale)}else if(o.s.id==='ball-trail'){c.save();c.globalCompositeOperation='lighter';const pattern=c.createPattern(o.img,'repeat');c.fillStyle=pattern;c.translate(-(time*.35%256),96);c.fillRect(time*.35%256,0,256,32);c.restore()}else{sprite(c,o.s.id,time/1000,w/2,h*.52,190,190,true)}}}
async function init(){const response=await fetch('./manifest.json');if(!response.ok)throw Error(response.status);manifest=await response.json();await Promise.all(manifest.sprites.map(async s=>{const img=new Image();img.src=s.file;await img.decode();return {s,img}})).then(loaded=>{for(const o of loaded){const [label,glyph]=names[o.s.id];const card=document.createElement('article');card.className='card';card.setAttribute('aria-label',label);card.title=label;const c=document.createElement('canvas');c.width=c.height=256;c.setAttribute('aria-label',label);o.canvas=c;const bar=document.createElement('div');bar.className='bar';bar.innerHTML=icon(glyph);const a=document.createElement('a');a.href=o.s.file;a.download='';a.setAttribute('aria-label',`הורדת ${label}`);a.title=label;a.innerHTML=icon('download');bar.append(a);card.append(c,bar);document.getElementById('sprites').append(card);items.push(o)}});for(const a of manifest.audio){const [label,glyph]=soundNames[a.id];const row=document.createElement('div');row.className='sound';row.setAttribute('aria-label',label);row.title=label;row.innerHTML=icon(glyph);for(const f of a.files){const ext=f.file.split('.').pop(),button=document.createElement('button');button.innerHTML=icon(ext);button.title=`${label} · ${ext.toUpperCase()}`;button.setAttribute('aria-label',button.title);button.dataset.file=f.file;button.onclick=async()=>{if(currentAudio){currentAudio.pause();currentAudio.currentTime=0}document.querySelectorAll('.playing').forEach(e=>e.classList.remove('playing'));const audio=new Audio(f.file);currentAudio=audio;audio.volume=Number(volume.value);audio.muted=muted;audio.onended=()=>row.classList.remove('playing');audio.onerror=()=>{row.classList.remove('playing');failed(button)};try{await audio.play();row.classList.add('playing')}catch{failed(button)}};row.append(button)}document.getElementById('sounds').append(row)}render();requestAnimationFrame(tick)}

init().catch(()=>failed(scene));
