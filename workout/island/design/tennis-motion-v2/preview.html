<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#173d36">
  <title>טניס · ספריית תנועה 02</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="preview.css">
  <script type="importmap">{"imports":{"three":"./vendor/three.module.js"}}</script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="preview.html" aria-label="ספריית תנועות טניס"><span class="ball-mark"></span><span>טניס <b>תנועה 02</b></span></a>
    <span class="edition">24 קליפים <i></i> 30Hz <i></i> 18 עצמות</span>
    <a class="report-link" href="REPORT.md">דוח הבדיקה <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5 15 15 5M5 5h10v10"/></svg></a>
  </header>
  <main class="workspace">
    <section class="stage-panel" aria-label="תצוגת תנועה בתלת ממד">
      <canvas id="stage" aria-label="שחקן טניס מונפש; אפשר לגרור כדי לסובב את המצלמה" tabindex="0"></canvas>
      <div class="stage-heading"><span class="eyebrow" id="category">TENNIS MOTION LIBRARY</span><h1 id="clip-title">טוען תנועות…</h1><p id="clip-note">אחיזה קשיחה · tennis-grip-v1</p></div>
      <nav class="views" id="views" aria-label="זווית צפייה"><button data-view="three" aria-pressed="true">¾</button><button data-view="front" aria-pressed="false">חזית</button><button data-view="side" aria-pressed="false">צד</button><button data-view="grip" aria-pressed="false">אחיזה</button></nav>
      <label class="height-control" id="height-control" hidden>גובה כדור <select id="height" aria-label="גובה כדור"><option value="low">נמוך</option><option value="medium" selected>בינוני</option><option value="high">גבוה</option></select></label>
      <div class="stage-foot"><span id="contact-label">טוען קובץ GLB</span><span class="hint">גרירה לסיבוב · גלילה לקירוב</span></div>
      <div id="error" role="alert" hidden></div>
    </section>
    <aside class="library" aria-label="בחירת קליפ">
      <div class="library-heading"><span>ספריית התנועות</span><span id="clip-count">24</span></div>
      <div class="clips" id="clips" role="group" aria-label="24 קליפים"></div>
      <a id="sheet-link" class="sheet-link" href="sheets/ready.webp" target="_blank" rel="noopener">גיליון 8 פריימים <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5 15 15 5M5 5h10v10"/></svg></a>
    </aside>
    <section class="transport" aria-label="בקרת ניגון">
      <button id="play" class="play" aria-label="עצירת הניגון">❚❚</button>
      <div class="timeline"><div class="time-labels"><span id="timestamp" dir="ltr">0.00 / 0.00 s</span><div class="time-actions"><button id="bridge">מעבר מהיכון</button><button id="jump-contact" hidden>לנקודת המגע</button></div></div><input id="time" type="range" min="0" max="1" value="0" step="0.0001" aria-label="זמן הקליפ"></div>
      <label class="speed-label">מהירות <select id="speed" aria-label="מהירות ניגון"><option value="0.25">¼×</option><option value="0.5">½×</option><option value="1" selected>1×</option><option value="1.5">1.5×</option></select></label>
      <span class="transport-note" id="frame-number">F 000 · 30Hz</span>
    </section>
  </main>
  <script type="module" src="preview.mjs"></script>
</body>
</html>
