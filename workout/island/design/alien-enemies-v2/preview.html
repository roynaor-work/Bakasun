<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0c1829">
  <meta name="description" content="12 אויבי חלל ידידותיים: תנועה, מצבי נזק ותקיפות רכות בתצוגה עצמאית.">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' file:; img-src 'self' file: data:; script-src 'self' file:; style-src 'self' file:; connect-src 'none'; object-src 'none'; base-uri 'none'">
  <title>חברים מהחלל · אויבים v2</title>
  <link rel="icon" href="sprites/small-saucer/sprite.png" type="image/png">
  <link rel="stylesheet" href="preview.css">
  <script src="catalog.js" defer></script>
  <script src="preview.js" defer></script>
</head>
<body>
<main class="app" id="app">
  <header class="topbar">
    <div class="brand"><span class="orbit" aria-hidden="true"></span><div><h1>חברים מהחלל</h1><p>12 אויבים קטנים. אישיות גדולה.</p></div></div>
    <nav class="top-actions" aria-label="תצוגה וקבצים"><a href="REPORT.md">דוח</a><a href="manifest.json" lang="en">JSON</a><button id="play" type="button" aria-pressed="false">השהיה</button></nav>
  </header>
  <div class="workspace">
    <section class="scene" aria-label="הדגמת האויב הנבחר">
      <div class="scene-heading"><div><span class="eyebrow">במרחב האימון</span><h2 id="enemy-name">טוען טייסת…</h2></div><span id="state-label" class="state-pill">שלם</span></div>
      <canvas id="stage" tabindex="0" aria-label="מסלול ותנועה. לחיצה משנה את נקודת הכיוון; חצים ימינה ושמאלה מזיזים אותה.">הדפדפן צריך לתמוך ב־Canvas להצגת האנימציות.</canvas>
      <div class="scene-caption"><span id="phase" role="status">מכינים מקום בין הכוכבים</span><label><input id="show-path" type="checkbox" checked> הצגת מסלול</label></div>
    </section>
    <aside class="hangar" aria-label="בחירת אויב">
      <div class="hangar-heading"><h2>בחרו חבר לטיסה</h2><span>01—12</span></div>
      <div id="roster" class="roster" role="group" aria-label="12 סוגי אויבים"></div>
      <p id="tagline" class="tagline"></p>
      <p class="hint">געו במרחב כדי לשנות את הכיוון</p>
    </aside>
  </div>
  <footer class="controls">
    <div class="damage-control" role="group" aria-label="מצב נזק">
      <span class="control-label">מצב</span>
      <button type="button" data-state="healthy" aria-pressed="true">שלם</button>
      <button type="button" data-state="scuffed" aria-pressed="false">שרוט</button>
      <button type="button" data-state="patched" aria-pressed="false">מטולא</button>
    </div>
    <div class="effect-controls"><button id="attack" type="button">הדגמת תקיפה</button><button id="death" type="button">היעלמות <span aria-hidden="true">✧</span></button></div>
  </footer>
  <p id="error" role="alert" hidden></p>
</main>
</body>
</html>
